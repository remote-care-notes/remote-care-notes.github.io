<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="roles-title roles-desc" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
	<title id="roles-title">3つのアプリの役割分担</title>
	<desc id="roles-desc">Tapo はカメラの映像、SwitchBot は温湿度の数値と家電操作、Alexa は本人側の音声インターフェース、それぞれを担当して、見守る側のスマホ・タブレットへつながる構造</desc>

	<!-- 列ヘッダ -->
	<text x="125" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#60739f">実家（本人がいる場所）</text>
	<text x="380" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#60739f">担当アプリ</text>
	<text x="635" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#60739f">起こること</text>

	<!-- 行1: Alexa -->
	<rect x="20" y="50" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="125" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">本人 ↔ Echo Dot</text>
	<text x="125" y="98" text-anchor="middle" font-size="11" fill="#60739f">「アレクサ、◯◯」と声で操作</text>

	<line x1="240" y1="80" x2="290" y2="80" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="295" y="50" width="170" height="60" rx="10" fill="#fff" stroke="#2337ff" stroke-width="2"/>
	<image href="/diagrams/icons/alexa.png" x="307" y="60" width="40" height="40"/>
	<text x="402" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#2337ff">Alexa</text>
	<text x="402" y="96" text-anchor="middle" font-size="10" fill="#60739f">本人が使う道具</text>

	<line x1="475" y1="80" x2="525" y2="80" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="530" y="50" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="635" y="78" text-anchor="middle" font-size="13" fill="#0f1219">声で家電操作</text>
	<text x="635" y="98" text-anchor="middle" font-size="11" fill="#60739f">（SwitchBot スキル経由）</text>

	<!-- 行2: SwitchBot -->
	<rect x="20" y="135" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="125" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">温湿度計 ・ 家電</text>
	<text x="125" y="183" text-anchor="middle" font-size="11" fill="#60739f">エアコン・照明・テレビなど</text>

	<line x1="240" y1="165" x2="290" y2="165" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="295" y="135" width="170" height="60" rx="10" fill="#fff" stroke="#2337ff" stroke-width="2"/>
	<image href="/diagrams/icons/switchbot.png" x="307" y="145" width="40" height="40"/>
	<text x="402" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#2337ff">SwitchBot</text>
	<text x="402" y="181" text-anchor="middle" font-size="10" fill="#60739f">測る・動かす</text>

	<line x1="475" y1="165" x2="525" y2="165" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="530" y="135" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="635" y="163" text-anchor="middle" font-size="13" fill="#0f1219">室温・湿度の数値</text>
	<text x="635" y="183" text-anchor="middle" font-size="11" fill="#60739f">（SwitchBot アプリ）</text>

	<!-- 行3: Tapo -->
	<rect x="20" y="220" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="125" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">カメラ</text>
	<text x="125" y="268" text-anchor="middle" font-size="11" fill="#60739f">部屋の映像と音</text>

	<line x1="240" y1="250" x2="290" y2="250" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="295" y="220" width="170" height="60" rx="10" fill="#fff" stroke="#2337ff" stroke-width="2"/>
	<image href="/diagrams/icons/tapo.png" x="307" y="230" width="40" height="40"/>
	<text x="402" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#2337ff">Tapo</text>
	<text x="402" y="266" text-anchor="middle" font-size="10" fill="#60739f">見る</text>

	<line x1="475" y1="250" x2="525" y2="250" stroke="#60739f" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="530" y="220" width="210" height="60" rx="10" fill="#e5e9f0" stroke="none"/>
	<text x="635" y="248" text-anchor="middle" font-size="13" fill="#0f1219">部屋の映像</text>
	<text x="635" y="268" text-anchor="middle" font-size="11" fill="#60739f">（Tapo アプリ）</text>

	<!-- 合流して見守る側のスマホ/タブレットへ -->
	<line x1="635" y1="290" x2="635" y2="350" stroke="#60739f" stroke-width="1.5" stroke-dasharray="5 4"/>
	<polygon points="635,360 628,348 642,348" fill="#60739f"/>

	<rect x="490" y="370" width="290" height="70" rx="12" fill="#fff" stroke="#0f1219" stroke-width="1.5"/>
	<text x="635" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">見守る側のスマホ／タブレット</text>
	<text x="635" y="422" text-anchor="middle" font-size="11" fill="#60739f">3つのアプリで、生活全体をカバー</text>

	<!-- 矢印マーカー定義 -->
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#60739f"/>
		</marker>
	</defs>
</svg>
