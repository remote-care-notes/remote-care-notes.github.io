<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="mt-title mt-desc" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
	<title id="mt-title">朝のルーティンのタイムライン</title>
	<desc id="mt-desc">起床予定の2時間前にエアコンが動き始め、起床時刻にAlexaが4ステップの挨拶（名前呼び・日付・睡眠の問いかけ・次の行動の提示）を流す</desc>

	<!-- タイムライン軸 -->
	<line x1="80" y1="120" x2="680" y2="120" stroke="#0f1219" stroke-width="2"/>

	<!-- マーカー：T-2時間 -->
	<circle cx="160" cy="120" r="8" fill="#2337ff"/>
	<text x="160" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2337ff">起床の 2 時間前</text>

	<!-- マーカー：T (起床時刻) -->
	<circle cx="600" cy="120" r="8" fill="#2337ff"/>
	<text x="600" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2337ff">起床時刻</text>

	<!-- 時間の流れ -->
	<text x="380" y="148" text-anchor="middle" font-size="11" fill="#60739f">2 時間かけて部屋の温度をゆっくり仕上げる</text>

	<!-- 左側：エアコン -->
	<rect x="40" y="180" width="240" height="100" rx="12" fill="#fff" stroke="#0f1219" stroke-width="1.5"/>
	<text x="160" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">エアコンを動かす</text>
	<text x="160" y="232" text-anchor="middle" font-size="11" fill="#60739f">SwitchBot のスケジュールで自動 ON</text>
	<text x="160" y="252" text-anchor="middle" font-size="11" fill="#60739f">冬：暖房 22〜23℃</text>
	<text x="160" y="270" text-anchor="middle" font-size="11" fill="#60739f">夏：冷房 25〜26℃</text>

	<!-- エアコン箱 → タイムライン T-2時間 へのライン -->
	<line x1="160" y1="180" x2="160" y2="128" stroke="#60739f" stroke-width="1.5"/>

	<!-- 右側：Alexaの挨拶 -->
	<rect x="480" y="180" width="240" height="240" rx="12" fill="#fff" stroke="#2337ff" stroke-width="2"/>
	<text x="600" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#2337ff">Alexa の挨拶（4 ステップ）</text>

	<!-- 4ステップ -->
	<line x1="500" y1="225" x2="700" y2="225" stroke="#e5e9f0" stroke-width="1"/>

	<text x="500" y="250" font-size="12" fill="#0f1219">1. 「おはようございます、◯◯さん」</text>
	<text x="510" y="268" font-size="10" fill="#60739f">名前呼び</text>

	<text x="500" y="295" font-size="12" fill="#0f1219">2. 「今日は◯月◯日◯曜日です」</text>
	<text x="510" y="313" font-size="10" fill="#60739f">日付・曜日</text>

	<text x="500" y="340" font-size="12" fill="#0f1219">3. 「昨日はよく眠れましたか？」</text>
	<text x="510" y="358" font-size="10" fill="#60739f">発話を促す問いかけ</text>

	<text x="500" y="385" font-size="12" fill="#0f1219">4. 「朝ごはんを食べましょう」</text>
	<text x="510" y="403" font-size="10" fill="#60739f">次の行動の提示</text>

	<!-- Alexa箱 → タイムライン T へのライン -->
	<line x1="600" y1="180" x2="600" y2="128" stroke="#60739f" stroke-width="1.5"/>

	<!-- 下部の補足 -->
	<text x="380" y="450" text-anchor="middle" font-size="12" fill="#60739f">起きた瞬間の不快感を減らし、本人がやんわり一日を始められる状態を作る</text>
</svg>
