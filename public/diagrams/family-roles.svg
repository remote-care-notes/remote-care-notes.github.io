<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="fam-title fam-desc" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
	<title id="fam-title">遠方の家族と近所の家族で分担する</title>
	<desc id="fam-desc">中央の実家を、遠方の家族と近所の家族が共有のTapoアカウントで二人体制で見守る。異変があれば、まず電話で本人に確認し、必要なら近所の家族が駆けつける流れ</desc>

	<defs>
		<marker id="fam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#60739f"/>
		</marker>
		<marker id="fam-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2337ff"/>
		</marker>
	</defs>

	<!-- 中央：実家 -->
	<rect x="270" y="30" width="220" height="100" rx="14" fill="#e5e9f0"/>
	<text x="380" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">実家</text>
	<text x="380" y="84" text-anchor="middle" font-size="12" fill="#0f1219">本人</text>
	<text x="380" y="106" text-anchor="middle" font-size="11" fill="#60739f">Tapoカメラ ・ SwitchBot ・ Echo Dot</text>

	<!-- 共有マーク（中央下） -->
	<rect x="305" y="170" width="150" height="44" rx="22" fill="#fff" stroke="#2337ff" stroke-width="1.5"/>
	<text x="380" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2337ff">Tapo アカウント共有</text>
	<text x="380" y="204" text-anchor="middle" font-size="10" fill="#60739f">同じカメラを別の端末から</text>

	<!-- 中央 → 共有 -->
	<line x1="380" y1="135" x2="380" y2="165" stroke="#2337ff" stroke-width="1.5" marker-end="url(#fam-arrow-blue)"/>

	<!-- 共有 → 左下: 遠方の家族 -->
	<line x1="305" y1="200" x2="180" y2="280" stroke="#2337ff" stroke-width="1.5" marker-end="url(#fam-arrow-blue)"/>

	<!-- 共有 → 右下: 近所の家族 -->
	<line x1="455" y1="200" x2="580" y2="280" stroke="#2337ff" stroke-width="1.5" marker-end="url(#fam-arrow-blue)"/>

	<!-- 左下：遠方の家族 -->
	<rect x="40" y="285" width="280" height="100" rx="14" fill="#fff" stroke="#0f1219" stroke-width="1.5"/>
	<text x="180" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">遠方の家族</text>
	<text x="180" y="335" text-anchor="middle" font-size="12" fill="#0f1219">システム担当</text>
	<text x="180" y="358" text-anchor="middle" font-size="11" fill="#60739f">カメラ・センサー設定／毎日の様子確認</text>
	<text x="180" y="376" text-anchor="middle" font-size="11" fill="#60739f">家電制御／訪問サービス連絡</text>

	<!-- 右下：近所の家族 -->
	<rect x="440" y="285" width="280" height="100" rx="14" fill="#fff" stroke="#0f1219" stroke-width="1.5"/>
	<text x="580" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1219">近所の家族</text>
	<text x="580" y="335" text-anchor="middle" font-size="12" fill="#0f1219">駆けつけ担当</text>
	<text x="580" y="358" text-anchor="middle" font-size="11" fill="#60739f">直接駆けつけ／対面で話す</text>
	<text x="580" y="376" text-anchor="middle" font-size="11" fill="#60739f">買い物代行／病院付き添い</text>

	<!-- 異変対応の流れ -->
	<text x="380" y="425" text-anchor="middle" font-size="12" fill="#60739f" font-weight="700">異変に気付いたら：</text>
	<text x="380" y="448" text-anchor="middle" font-size="12" fill="#0f1219">カメラで確認 → まず電話で本人に確認 → 必要なら近所の家族が駆けつけ</text>
</svg>
